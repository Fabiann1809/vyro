appId: io.github.fabiann1809.vyro
productName: VYRO
copyright: Copyright © 2026 Fabiann1809
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!docs/**'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
asarUnpack:
  - resources/**
win:
  executableName: vyro
  target: nsis
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  target: dmg
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSCameraUsageDescription: VYRO usa la cámara para analizar tu técnica. El video nunca se guarda ni sale de tu equipo.
    - NSMicrophoneUsageDescription: VYRO usa el micrófono solo en las habilidades con sonido, para medir el tono y el ritmo. El audio nunca se guarda ni sale de tu equipo.
  notarize: false
dmg:
  artifactName: ${name}-${version}-${arch}.${ext}
linux:
  target: AppImage
  maintainer: Fabiann1809
  category: Utility
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
# No auto-update in the MVP (see D10 in docs/DECISIONS.md).
publish: null
